name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          get() { curl -sSL -m 40 -A "$UA" -o "$1" -w "$1 %{http_code} %{url_effective}\n" "$2" >> status.txt 2>>err.txt || echo "$1 FAIL $2" >> status.txt; }
          get mk_robots.txt https://kasif.mkutup.gov.tr/robots.txt
          get mk_home.html https://kasif.mkutup.gov.tr/
          get mk_home2.html https://www.mkutup.gov.tr/
          get ky_robots.txt https://www.kitapyurdu.com/robots.txt
          cat status.txt
      - name: Save results
        run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-results
          git rm -rfq --cached . && find . -maxdepth 1 ! -name out ! -name .git ! -name . -exec rm -rf {} +
          git add out && git commit -qm "probe results" && git push -f origin probe-results
